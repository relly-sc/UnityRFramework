name: Create GitHub Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create release for tag
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its title and notes."
          elif gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "UnityRFramework $TAG_NAME" \
              --generate-notes; then
            echo "Release created."
          else
            # A maintainer may have created the release after the initial check.
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
