name: Publish UPM Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

# This workflow force-updates only the generated `upm` branch.
permissions:
  contents: write

jobs:
  publish:
    name: Generate UPM packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Generate core and Samples packages
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools~/build_upm_packages.py --output "$RUNNER_TEMP/release"

      - name: Upload Samples package artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.relly-sc.unityrframework.samples
          path: ${{ runner.temp }}/release/com.relly-sc.unityrframework.samples
          if-no-files-found: error

      - name: Publish core UPM branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/release/com.relly-sc.unityrframework"
          commit_message_file="$RUNNER_TEMP/upm-commit-message.txt"
          source_sha="$(git rev-parse HEAD)"

          if [[ ! -f "Library/RFramework/RFramework.Library.asmdef" ]]; then
            echo "RFramework submodule was not checked out." >&2
            exit 1
          fi

          if [[ ! -f "Library/RFramework/RFramework.Library.asmdef.meta" ]]; then
            echo "RFramework submodule does not track Unity .meta files." >&2
            exit 1
          fi

          library_sha="$(git -C Library/RFramework rev-parse HEAD)"
          git show -s --format='%B' "$source_sha" > "$commit_message_file"
          printf '\nPublished from main: %s\nRFramework: %s\n' \
            "$source_sha" "$library_sha" >> "$commit_message_file"

          cd "$release_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -F "$commit_message_file"
          git branch -M upm
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin upm

      - name: Configure Samples deploy key
        env:
          SAMPLES_DEPLOY_KEY: ${{ secrets.SAMPLES_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SAMPLES_DEPLOY_KEY" ]]; then
            echo "Repository secret SAMPLES_DEPLOY_KEY is not configured." >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SAMPLES_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"

      - name: Publish Samples repository
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/release/com.relly-sc.unityrframework.samples"
          commit_message_file="$RUNNER_TEMP/upm-commit-message.txt"

          cd "$release_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -F "$commit_message_file"
          git branch -M main
          git remote add origin "git@github.com:relly-sc/UnityRFramework-Samples.git"
          git push --force origin main
